name: Compile Typst figure
run-name: Compile ${{ inputs.job_id }}
on:
  workflow_dispatch:
    inputs:
      job_id:
        description: Unique job identifier (use a UUID)
        required: true
        type: string
      project:
        description: Project JSON exported by Do Thi Studio (max 45 KB)
        required: true
        type: string
permissions:
  contents: read
jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: python -m pip install typst==0.14.2
      - name: Validate job identifier
        env:
          JOB_ID: ${{ inputs.job_id }}
        run: node -e "if (!/^[a-zA-Z0-9-]{1,64}$/.test(process.env.JOB_ID)) process.exit(1)"
      - name: Validate project and generate native Typst
        env:
          PROJECT_JSON: ${{ inputs.project }}
        run: node scripts/render.mjs
      - name: Compile PDF, PNG and SVG
        run: python scripts/compile.py
      - uses: actions/upload-artifact@v4
        with:
          name: figure-${{ inputs.job_id }}
          path: outputs/
          retention-days: 7
          if-no-files-found: error
