name: Validate math and Typst exports
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run samples
      - run: python -m pip install typst==0.14.2
      - name: Compile all sample documents
        run: |
          for source in outputs/samples/*.typ; do
            python scripts/compile.py "$source"
          done
